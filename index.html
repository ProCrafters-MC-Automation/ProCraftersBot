    <!-- SWARM AUTOMATION TASKS TAB -->
    <div id="tasksTab" class="tab-pane m-4">
      <div class="flex" style="flex-wrap: wrap;">
        <!-- Movement & Location Tasks -->
        <div class="border m-4" style="min-width: 320px; flex: 1;">
          <span class="label" style="position: relative; top:-25px">
            <label class="label-text">Movement & Navigation</label>
          </span>
          <div class="mu-2 flex">
            <input type="text" id="taskPlayerTarget" class="text-input" placeholder="Player name (e.g. Master)">
            <button id="btnTaskCome" class="button m-1">Come Here</button>
            <button id="btnTaskFollow" class="button m-1">Follow</button>
          </div>
          <div class="mu-2 flex" style="align-items: center; gap: 5px;">
            <span class="label-text">Goto:</span>
            <input type="number" id="taskGotoX" class="text-input input-sm" placeholder="X">
            <input type="number" id="taskGotoY" class="text-input input-sm" placeholder="Y">
            <input type="number" id="taskGotoZ" class="text-input input-sm" placeholder="Z">
            <button id="btnTaskGoto" class="button m-1">Go</button>
          </div>
          <div class="mu-2 flex" style="align-items: center; gap: 5px;">
            <span class="label-text">Relative:</span>
            <input type="number" id="taskRelX" class="text-input input-sm" placeholder="dX" value="0">
            <input type="number" id="taskRelY" class="text-input input-sm" placeholder="dY" value="0">
            <input type="number" id="taskRelZ" class="text-input input-sm" placeholder="dZ" value="5">
            <button id="btnTaskRelMove" class="button m-1">Rel Move</button>
          </div>
          <div class="mu-2 flex">
            <button id="btnTaskSetHome" class="button m-1">Set Home</button>
            <button id="btnTaskGoHome" class="button m-1">Go Home</button>
          </div>
          <div class="mu-4">
            <button id="btnTaskStopAll" class="button" style="width: 100%;">Stop All Movement & Tasks</button>
          </div>
        </div>

        <!-- Harvesting & Crafting Tasks -->
        <div class="border m-4" style="min-width: 320px; flex: 1;">
          <span class="label" style="position: relative; top:-25px">
            <label class="label-text">Harvest, Mine & Craft</label>
          </span>
          <div class="mu-2 flex" style="align-items: center; gap: 5px;">
            <input type="text" id="taskBlockName" class="text-input" placeholder="Block name (e.g. oak_log)">
            <input type="number" min="1" id="taskBlockCount" class="text-input input-sm" value="5" placeholder="Qty">
            <button id="btnTaskHarvest" class="button m-1">Harvest</button>
          </div>
          <div class="mu-2 flex" style="align-items: center; gap: 5px;">
            <input type="text" id="taskCraftName" class="text-input" placeholder="Item to craft (e.g. planks)">
            <input type="number" min="1" id="taskCraftCount" class="text-input input-sm" value="4" placeholder="Qty">
            <button id="btnTaskCraft" class="button m-1">Craft</button>
          </div>
          <div class="mu-2 flex" style="align-items: center; gap: 5px;">
            <span class="label-text">Hunt:</span>
            <input type="number" min="1" id="taskHuntCount" class="text-input input-sm" value="3" placeholder="Qty">
            <button id="btnTaskHunt" class="button m-1">Hunt Animals</button>
            <button id="btnTaskCollect" class="button m-1">Collect Drops</button>
          </div>
          <div class="mu-2 flex" style="align-items: center; gap: 5px;">
            <input type="text" id="taskDropItem" class="text-input" placeholder="Item name to drop">
            <button id="btnTaskDropItem" class="button m-1">Drop Item</button>
          </div>
        </div>

        <!-- Excavation & Inventory Tasks -->
        <div class="border m-4" style="min-width: 320px; flex: 1;">
          <span class="label" style="position: relative; top:-25px">
            <label class="label-text">Excavation & Inventory</label>
          </span>
          <div class="mu-2 flex" style="align-items: center; gap: 5px;">
            <input type="text" id="taskHoleDim" class="text-input" placeholder="Dimensions (e.g. 5x5x3)" value="5x5x3">
            <button id="btnTaskHole" class="button m-1">Dig Hole</button>
          </div>
          <div class="mu-2 flex" style="align-items: center; gap: 5px;">
            <input type="text" id="taskEquipName" class="text-input" placeholder="Item name (e.g. diamond_sword)">
            <button id="btnTaskEquip" class="button m-1">Equip Item</button>
          </div>
          <div class="mu-2 flex" style="align-items: center; gap: 5px;">
            <button id="btnTaskNearby" class="button m-1" style="width: 100%;">Scan Nearby Blocks</button>
          </div>
          <div class="mu-2 flex" style="align-items: center; gap: 5px;">
            <input type="text" id="taskLocateTarget" class="text-input" placeholder="Target player or entity">
            <button id="btnTaskLocate" class="button m-1">Locate</button>
          </div>
        </div>

        <!-- Defense, Memory & Learning Tasks -->
        <div class="border m-4" style="min-width: 320px; flex: 1;">
          <span class="label" style="position: relative; top:-25px">
            <label class="label-text">Defense, Memory & Learning</label>
          </span>
          <div class="mu-2 flex" style="align-items: center; gap: 5px;">
            <button id="btnTaskProtect" class="button m-1" style="flex: 1;">Protect Area</button>
            <button id="btnTaskGuardPos" class="button m-1" style="flex: 1;">Guard Pos</button>
          </div>
          <div class="mu-2 flex" style="align-items: center; gap: 5px;">
            <span class="label-text">Learn:</span>
            <button id="btnTaskLearn" class="button m-1">Start Learn</button>
            <button id="btnTaskRecite" class="button m-1">Recite / Stop</button>
          </div>
          <div class="mu-2 flex" style="align-items: center; gap: 5px;">
            <input type="text" id="taskMemoryKey" class="text-input input-sm" placeholder="Key">
            <input type="text" id="taskMemoryVal" class="text-input input-sm" placeholder="Value">
            <button id="btnTaskRemember" class="button m-1">Remember</button>
            <button id="btnTaskValueOf" class="button m-1">Get</button>
          </div>
        </div>
      </div>
    </div>
